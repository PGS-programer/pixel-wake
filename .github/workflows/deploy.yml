name: Publish Pixel Wake
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm test
      - run: npm run test:online
      - name: Build for the actual Pages URL
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL }}
      - name: Check publish artifact
        run: npm run verify:deploy
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
