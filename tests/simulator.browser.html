<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pixel Wake — QA local del simulador</title><style>body{margin:0;background:#102e38;color:#e6e3d6;font:14px sans-serif}#qa{position:fixed;bottom:0;left:0;right:0;z-index:200;background:#102e38;padding:10px;border-top:1px solid #b69d72;display:flex;gap:10px;align-items:center}#qa button{padding:10px;background:#dfc38e;border:0;color:#16323b;cursor:pointer}#qa output{font:11px monospace;white-space:pre-wrap}#app{position:fixed;inset:0}</style><div id="app"></div><aside id="qa"><button id="start">INICIAR QA</button><button id="voyage" disabled>TRAVESÍA COMPLETA QA</button><button id="check" disabled>COMPROBAR ESTADO</button><output id="report">Sólo localhost. No modifica el perfil del arcade.</output></aside><script type="module">
import {startSimulator}from '/src/simulator/index.js';
import {MISSIONS}from '/src/simulator/world/harbor.js';
import {createPilot}from './fixtures/dockingPilot.js';
const report=document.querySelector('#report');let dispose;
document.querySelector('#start').onclick=async()=>{try{dispose?.();dispose=await startSimulator(document.querySelector('#app'),MISSIONS[0],()=>{dispose();report.textContent='SALIDA OK';},()=>{});document.querySelector('#voyage').disabled=document.querySelector('#check').disabled=false;report.textContent='PUENTE INICIADO';}catch(e){report.textContent='ERROR: '+e.message;}};
document.querySelector('#check').onclick=()=>{const q=window.__PW_SIM__;report.textContent=JSON.stringify({port:q.state.port.lever,starboard:q.state.starboard.lever,rudder:q.state.rudder,heading:q.state.heading,time:q.state.time,x:q.state.x,y:q.state.y,drawCalls:q.view.renderer.info.render.calls,triangles:q.view.renderer.info.render.triangles,water:!!q.view.water});};
document.querySelector('#voyage').onclick=()=>{const q=window.__PW_SIM__;q.reset();const pilot=createPilot(MISSIONS[0]);let arrived=false,steps=0;const run=()=>{for(let i=0;i<600&&!q.mission.finished&&steps<36000;i++,steps++){if(!arrived)arrived=pilot(q.state);q.stepForTest(1/60);if(arrived&&q.mission.safeTime>=3&&!q.mission.lines.length)q.moor();}if(q.mission.finished){report.textContent='PASS: TRAVESÍA COMPLETA '+JSON.stringify({score:q.mission.result.score,collisions:q.mission.stats.collisions,lines:q.mission.lines.filter(l=>l.secured).length,time:q.state.time});}else if(steps>=36000)report.textContent='FAIL: no se completó el atraque';else requestAnimationFrame(run);};run();};
</script></html>
